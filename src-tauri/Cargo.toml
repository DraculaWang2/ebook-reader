[package]
name = "ebook-reader"
version = "0.1.0"
description = "电子书阅读器：EPUB / PDF，支持目录跳转、书签、笔记"
edition = "2021"

[lib]
name = "ebook_reader_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
dirs = "5"
zip = "2"
roxmltree = "0.20"
encoding_rs = "0.8"
regex = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
